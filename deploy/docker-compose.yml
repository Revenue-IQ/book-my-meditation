# Production compose file — copied to the Lightsail instance by the deploy workflow.
# Two containers: the app (UI + API in one image) and Postgres.
# Expects POSTGRES_PASSWORD in the environment (the workflow writes it to .env on the server).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: meditation
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d meditation']
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ghcr.io/revenue-iq/book-my-meditation:latest
    restart: unless-stopped
    ports:
      - '80:3001'
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/meditation
      AUTH_MODE: local # no-login demo mode; Clerk comes later
      API_PORT: '3001'
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
